name: 核心质量检查

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 核心质量检查-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-core:
    name: 后端核心测试与架构检查
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-compose-api.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements-compose-api.txt

      - name: 编译检查
        run: python -m compileall -q agent application server

      - name: 阶段六合同与架构检查
        run: |
          python scripts/refactor/check_stage6_contract.py
          python scripts/refactor/check_stage6_architecture.py
          python scripts/refactor/check_stage6_2_architecture.py
          python scripts/refactor/check_stage6_3_architecture.py
          python scripts/refactor/check_stage6_4_architecture.py
          python scripts/refactor/check_stage6_5_architecture.py

      - name: 运行后端核心回归测试
        run: >-
          python -m pytest -q
          tests/unit/test_agent_canonical_proposal_runtime_v2317.py
          tests/unit/test_runtime_data_database_authority.py
          tests/unit/test_internal_mcp_stdio_phase234.py
          tests/unit/test_phase11_p2a_market_analysis_service.py
          tests/unit/test_phase11_p2b_evidence_service.py
          tests/unit/test_timeout_prefix_99_policy.py
          tests/unit/test_tool_io_contract_v2203.py
          tests/unit/test_tool_list_aggregation_v2301.py
          tests/unit/test_stage6_2_read_only_web.py
          tests/unit/test_stage6_3_paper_trading_web.py
          tests/unit/test_stage6_4_agent_web.py
          tests/unit/test_stage6_5_cutover.py
          tests/unit/test_task_runtime_recovery_integrity_v1.py
          tests/unit/test_contextbundle_slot_free_runtime_v2316.py
          tests/unit/test_phase17_handoff_policy_router.py
          tests/unit/test_phase17_handoff_core.py
          tests/unit/test_phase17_handoff_coordinator.py
          tests/unit/test_progressive_worker_tool_runtime_v212.py
          tests/unit/test_deterministic_worker_dag_compilation_v2311.py
          tests/unit/test_worker_scope_planning_v2304.py
          tests/unit/test_capability_requirement_contract_v2309.py

  frontend-quality:
    name: 前端类型、单测与生产构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 运行前端单测
        run: npm test

      - name: 构建生产前端
        run: npm run build
